<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KotoMusicBeta</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #121212, #282828);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .player-container {
      background: #181818;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .album-art {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin-bottom: 20px;
      color: #555;
    }

    .track-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .track-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 14px;
      color: #b3b3b3;
    }

    .progress-container {
      margin-bottom: 16px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #535353;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #1db954;
      border-radius: 3px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #b3b3b3;
      margin-top: 6px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 0;
    }

    .control-btn {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .control-btn.active {
      color: #1db954;
    }

    .play-btn {
      background: #1db954;
      color: black;
      width: 60px;
      height: 60px;
      font-size: 20px;
    }

    .play-btn:hover {
      background: #1ed760;
      transform: scale(1.05);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .volume-slider {
      width: 100px;
      -webkit-appearance: none;
      height: 5px;
      background: #535353;
      border-radius: 3px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }

    .playlist {
      margin-top: 30px;
      max-height: 300px;
      overflow-y: auto;
    }

    .track-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .track-item.active {
      background: rgba(29, 185, 84, 0.2);
    }

    .track-item-title {
      font-size: 15px;
    }

    .track-item-artist {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="album-art">🎵</div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Выберите трек</div>
      <div class="track-artist" id="trackArtist">—</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
      </div>
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="control-btn" id="shuffleBtn">🔀</button>
      <button class="control-btn" id="prevBtn">⏮</button>
      <button class="control-btn play-btn" id="playBtn">▶</button>
      <button class="control-btn" id="nextBtn">⏭</button>
      <button class="control-btn" id="repeatBtn">🔁</button>
    </div>

    <div class="volume-container">
      <span>🔈</span>
      <input type="range" min="0" max="1" step="0.01" value="0.8" class="volume-slider" id="volumeSlider" />
    </div>

    <div class="playlist" id="playlist"></div>

    <audio id="audio"></audio>
  </div>

  <script>
    const customTitles = {
      // Примеры:
      // "KHAOS_Jmilton_-_Montagem_Supersonic_Muzvoy.com_(SkySound.cc).mp3": { title: "Montagem Supersonic", artist: "KHAOS, Jmilton" },
    };

    const songFiles = [
      "Artur_Pirozhkov_-_Esli_hochesh_tancevat_tancuj_tancuj_Muzjan.com_(SkySound.cc).mp3",
      "ATLXS - PASSO BEM SOLTO - Slowed.mp3",
      "dogewell-vishnyovaya-semyorka-mp3.mp3",
      "Jmilton - Montagem Bandido (feat. Itamar Mc).mp3",
      "KHAOS_Jmilton_-_Montagem_Supersonic_Muzvoy.com_(SkySound.cc).mp3"
    ];

    const tracks = songFiles.map(file => {
      const custom = customTitles[file];
      if (custom) {
        return { title: custom.title, artist: custom.artist, file: file };
      } else {
        let title = file.replace(/\.mp3$/i, '')
                         .replace(/_/g, ' ')
                         .replace(/\b\w/g, l => l.toUpperCase());
        return { title, artist: "Неизвестен", file };
      }
    });

    // Элементы DOM
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const trackTitleEl = document.getElementById('trackTitle');
    const trackArtistEl = document.getElementById('trackArtist');
    const playlistEl = document.getElementById('playlist');

    // Состояния
    let currentTrackIndex = 0;
    let isShuffle = false;
    let isRepeat = false;

    audio.volume = volumeSlider.value;

    // === Функции ===
    function renderPlaylist() {
      playlistEl.innerHTML = '';
      tracks.forEach((track, index) => {
        const div = document.createElement('div');
        div.className = 'track-item';
        if (index === currentTrackIndex) div.classList.add('active');
        div.innerHTML = `
          <div class="track-item-title">${track.title}</div>
          <div class="track-item-artist">${track.artist}</div>
        `;
        div.addEventListener('click', () => loadTrack(index));
        playlistEl.appendChild(div);
      });
    }

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracks[index];
      audio.src = `songs/${track.file}`;
      trackTitleEl.textContent = track.title;
      trackArtistEl.textContent = track.artist;
      renderPlaylist();
      playBtn.textContent = '▶';
    }

    function playTrack() {
      audio.play().catch(e => console.log("Воспроизведение заблокировано:", e));
      playBtn.textContent = '⏸';
    }

    function getNextTrackIndex() {
      if (isShuffle) {
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * tracks.length);
        } while (newIndex === currentTrackIndex && tracks.length > 1);
        return newIndex;
      } else {
        return (currentTrackIndex + 1) % tracks.length;
      }
    }

    function getPrevTrackIndex() {
      if (isShuffle) {
        // В shuffle режиме "назад" просто возвращает к предыдущему (можно улучшить с историей)
        return (currentTrackIndex - 1 + tracks.length) % tracks.length;
      } else {
        return (currentTrackIndex - 1 + tracks.length) % tracks.length;
      }
    }

    // === Слушатели кнопок ===
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        playTrack();
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });

    nextBtn.addEventListener('click', () => {
      currentTrackIndex = getNextTrackIndex();
      loadTrack(currentTrackIndex);
      playTrack();
    });

    prevBtn.addEventListener('click', () => {
      currentTrackIndex = getPrevTrackIndex();
      loadTrack(currentTrackIndex);
      playTrack();
    });

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('active', isRepeat);
    });

    // === Аудио события ===
    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      const duration = audio.duration || 0;
      const percent = duration ? (currentTime / duration) * 100 : 0;
      progress.style.width = `${percent}%`;
      currentTimeEl.textContent = formatTime(currentTime);
      if (!isNaN(duration)) durationEl.textContent = formatTime(duration);
    });

    progressBar.addEventListener('click', (e) => {
      const width = progressBar.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration || 0;
      if (duration) audio.currentTime = (clickX / width) * duration;
    });

    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value;
    });

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        audio.currentTime = 0;
        playTrack();
      } else {
        nextBtn.click();
      }
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // === Инициализация ===
    if (tracks.length > 0) {
      loadTrack(0);
    }
    renderPlaylist();
  </script>
</body>
</html>
